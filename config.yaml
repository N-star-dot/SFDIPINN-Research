# ---------------------------------------------------------------------------
# SFDI PINN replication config, pointed at the lab's real files. For the
# synthetic stand-in data (no lab files needed), use config.synthetic.yaml
# (SFDI_CONFIG=config.synthetic.yaml) instead.
# Lines marked ASK PL are things only your project lead can tell you.
# ---------------------------------------------------------------------------

# Paths (relative to this folder, or set SFDI_DATA_ROOT to override data_root).
data_root: ~/Downloads/SFDIDATA
lut_path: luts/LUT_g0p9_0_0.1.mat   # lab Monte Carlo LUT (g = 0.9, f = 0 and 0.1 mm^-1)
lut_format: mat                      # npz | mat  (stand-in: luts/standin_whitemc.npz with npz)
lut_mat_keys: {struct: LUT, mua: Mua, musp: Musp, Rd: [M1, M2], freqs: [0.0, 0.1]}   # freqs are not stored in the file
results_dir: results/real          # synthetic runs go to results/synthetic
processed_root: data/processed       # fast per-cell .npz cache built by scripts/ingest_data.py

# File layout: one folder per subject+site, e.g. SFDIDATA/C1-Arm/R-Arm-Left-WithoutCorrection.tif
file_pattern: "{subject}-{site}/R-{site}-{side}-WithoutCorrection.tif"
mask_pattern: "{subject}-{site}/Mask-{site}-{side}-WithoutCorrection.tif"
ref_pattern:  "{subject}-{site}/M-{site}-{side}-WithoutCorrection.tif"

# Axes of each hyperstack (8 wavelengths x 8 spatial frequencies)
wavelengths: [471, 526, 591, 621, 691, 731, 811, 851]
stack_freqs: [0.0, 0.05, 0.1, 0.15, 0.2, 0.3, 0.4, 0.5]   # real z-slice frequencies
use_freqs: [0.0, 0.1]                                       # the two the PINN uses

# The lab's supplied mu_a maps are LUT inversions that hit the LUT bound and
# get capped at exactly this value on many 471 nm pixels; those pixels (and
# any NaN failed-inversion pixels) are excluded, not treated as real readings.
ref_caps: {mua: auto, musp: auto}   # auto = detect the LUT clamp per file (C3 is clamped at 0.1955, others at 0.2)

subjects: [C1, C2, C3, P1, P2]
sites: [Arm, Hand]
sides: [Left, Right]

forward:
  n: 1.4                             # ASK PL: tissue refractive index in their code
  A_source: fresnel                  # fresnel | poly | value
  A_value: null                      # ASK PL: put the calibrated boundary parameter B here

pinn:                                # from slide 17 and the ablation panel (slide 27)
  widths: [128, 128, 128]
  activation: silu
  loss: huber_log                    # huber_log (slide 17) | log_mse (ablation panel says Log MSE)
  huber_delta: 0.03
  lr: 0.003
  lr_decay_per_step: 0.9997
  batch_size: 32768
  steps: 10000
  eval_every: 100
  seed: 42
  bounds: {mua: [0.0005, 0.5], musp: [0.02, 10.0]}   # ASK PL: "Physics & output bounds" panel

# Slide 17: train on C1, all four sites, all wavelengths. Predict C2 and C3.
train_on: {subjects: [C1], sites: [Arm, Hand], sides: [Left, Right], wavelengths: all}
test_on:  {subjects: [C2, C3], sites: [Arm, Hand], sides: [Left, Right]}

# Slides 6 to 9 and 13 to 16 use these cells for the per-pixel tables
table_cells: [[C1, Arm, Left], [C1, Hand, Left]]

# Slides 26 to 38. Each run changes only what it lists.
ablations:
  - {name: all_wavelengths,  train_on: {subjects: [C2]}}
  - {name: wl_621_851,       train_on: {subjects: [C2], wavelengths: [621, 691, 731, 811, 851]}}
  - {name: wl_811_851,       train_on: {subjects: [C2], wavelengths: [811, 851]}}
  - {name: wl_811,           train_on: {subjects: [C2], wavelengths: [811]}}
  - {name: wl_471_526,       train_on: {subjects: [C2], wavelengths: [471, 526]}}
  - {name: site_C2_arm,      train_on: {subjects: [C2], sites: [Arm]}}
  - {name: site_C2_hand,     train_on: {subjects: [C2], sites: [Hand]}}
  - {name: subject_C1,       train_on: {subjects: [C1]}}
  - {name: model_cuccia,     train_on: {subjects: [C2]}, model: cuccia}
  - {name: model_mlp,        train_on: {subjects: [C2]}, model: mlp}
